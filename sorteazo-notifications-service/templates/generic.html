<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Afacad:wght@400;700&display=swap');

        body {
            font-family: "Afacad", sans-serif;
            background-color: #F1F1F1;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            margin: 30px auto;
            background: #FFFFFF;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        .title {
            font-size: 24px;
            font-weight: 700;
            color: #175B43;
            text-align: center;
        }

        .divider {
            width: 100px;
            height: 3px;
            background: #579460;
            border-radius: 8px;
            margin: 10px auto 25px;
        }

        .text {
            color: #363636;
            font-size: 17px;
            line-height: 1.5;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            color: #B3B3B3;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="title">{{titulo}}</div>
        <div class="divider"></div>
        <p class="text">{{descripcion}}</p>
        <div class="footer">© 2025 Sorteazo — Todos los derechos reservados.</div>
    </div>
</body>

</html>
